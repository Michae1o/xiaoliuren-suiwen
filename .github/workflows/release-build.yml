name: 出成品（Windows + 安卓）

# 手动触发：把 Windows 便携包和安卓 APK 编出来，挂到指定的 Release 上。
# 用法：Actions → 这个工作流 → Run workflow → 填已存在的 tag（例如 v1.0.0）。
# 编出来的都是「本仓源码」这一份：判据、界面、提示词都来自当前 main。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要挂到哪个 Release（已存在的 tag 名）'
        required: true

permissions:
  contents: write

jobs:
  windows:
    name: Windows 便携包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop-shell/src-tauri

      - name: 编 exe
        working-directory: apps/desktop-shell
        run: npx --yes @tauri-apps/cli@^2 build

      - name: 组装便携包
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rel = 'apps/desktop-shell/src-tauri/target/release'
          # WebView2Loader.dll 由 webview2-com-sys 随包提供，MSVC 构建时不一定落到 target/release，缺了就从 cargo 源码缓存里取 x64 那份
          $dll = Join-Path $rel 'WebView2Loader.dll'
          if (-not (Test-Path $dll)) {
            $src = Get-ChildItem "$env:USERPROFILE\.cargo\registry\src\*\webview2-com-sys-*\x64\WebView2Loader.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $src) { throw 'WebView2Loader.dll 找不到：cargo 缓存里也没有 webview2-com-sys' }
            Copy-Item $src.FullName $dll
            Write-Host "从 $($src.FullName) 取了 WebView2Loader.dll"
          }
          New-Item -ItemType Directory -Force 'out/app' | Out-Null
          Copy-Item 'apps/desktop-shell/pkg/遂问.exe'      'out/'
          Copy-Item 'apps/desktop-shell/pkg/使用说明.txt'   'out/'
          Copy-Item "$rel/xiaoliuren.exe"                  'out/app/'
          Copy-Item $dll                                   'out/app/'
          $ver = (Get-Content 'apps/desktop-shell/src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json).version
          Compress-Archive -Path 'out/*' -DestinationPath "Suiwen-Windows-$ver.zip" -Force
          Get-ChildItem 'out' -Recurse | Select-Object FullName, Length

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: Suiwen-Windows-*.zip
          fail_on_unmatched_files: true

  android:
    name: 安卓 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK
        run: |
          set -e
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK=$SDK"
          ls "$SDK/platforms" || true
          ls "$SDK/cmdline-tools" || true
          if [ ! -d "$SDK/platforms/android-34" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" > /dev/null
          fi

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/android/kuikly/**/*.gradle.kts', 'apps/android/kuikly/gradle/wrapper/gradle-wrapper.properties') }}

      - name: 编 APK（仓里没钥匙，用调试签名）
        working-directory: apps/android/kuikly
        run: ./gradlew :androidApp:assembleRelease --console=plain --no-daemon

      - name: 改名
        run: |
          set -e
          VER=$(grep -oP 'versionName\s*=\s*"\K[^"]+' apps/android/kuikly/androidApp/build.gradle.kts | head -1)
          echo "版本 $VER"
          cp apps/android/kuikly/androidApp/build/outputs/apk/release/androidApp-release.apk "Suiwen-Android-$VER.apk"

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: Suiwen-Android-*.apk
          fail_on_unmatched_files: true
